<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embarca · Viagens da equipe</title>
<meta name="description" content="Protótipo navegável do Embarca, site interno para gestores acompanharem as viagens a trabalho da equipe. Trabalho final de UX, pós-graduação FGV.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Paleta baseada na marca FGV */
  --azul-escuro:#013E7F;
  --azul:#058FD0;
  --azul-claro:#E6F3FB;
  --fundo:#F3F6FA;
  --superficie:#FFFFFF;
  --texto:#0E1B2C;
  --texto-2:#4B5B70;
  --borda:#D8E1EB;
  --sucesso:#18794E;  --sucesso-claro:#E3F4EA;
  --alerta:#9A5B00;   --alerta-claro:#FFF3DC;
  --perigo:#B42318;   --perigo-claro:#FDECEA;

  /* Métricas de UX do projeto */
  --alvo:44px;   /* altura mínima de botões e links: 44px ≈ 1,2 cm, acima do mínimo de 0,8 cm */
  --esp:4mm;     /* espaçamento padrão entre elementos: 4 mm */
  --raio:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.5;color:var(--texto);background:var(--fundo);min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px;border-radius:8px}

/* ---------- Estrutura: menu lateral + conteúdo ---------- */
.app{display:flex;min-height:100vh}
.sidebar{width:256px;flex:none;background:var(--azul-escuro);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.sidebar .marca{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.3rem;min-height:var(--alvo);padding:0 10px;margin-bottom:20px;border-radius:10px}
.sidebar .marca:hover{background:rgba(255,255,255,.1)}
.sidebar nav{display:flex;flex-direction:column;gap:6px}
.sidebar nav a{display:flex;align-items:center;gap:12px;min-height:var(--alvo);padding:0 12px;border-radius:10px;font-weight:600;color:#D6E8F5}
.sidebar nav a:hover{background:rgba(255,255,255,.1)}
.sidebar nav a[aria-current="page"]{background:#fff;color:var(--azul-escuro)}
.sidebar nav a .badge{margin-left:auto}
.sidebar .pe{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:10px 4px;font-size:.88rem;color:#BFDDF2}
.sidebar .pe a{display:flex;align-items:center;gap:10px;min-height:var(--alvo);padding:0 8px;border-radius:10px}
.sidebar .pe a:hover{background:rgba(255,255,255,.1)}
.sidebar .pe img{background:#fff;padding:8px 10px;border-radius:8px;height:40px;width:auto;align-self:flex-start;margin:10px 8px 0}
.principal{flex:1;min-width:0;display:flex;flex-direction:column}
.topo{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;min-height:72px;padding:0 32px;background:var(--superficie);border-bottom:1px solid var(--borda)}
.topo .titulos{flex:1;min-width:0}
.trilha{font-size:.85rem;color:var(--texto-2)}
.trilha a{display:inline-flex;align-items:center;min-height:32px;text-decoration:underline} /* ≥ 0,8 cm */
.trilha{line-height:1}
.topo h1{font-size:1.35rem;font-weight:700;line-height:1.25}
.btn-icone{display:inline-flex;align-items:center;justify-content:center;width:var(--alvo);height:var(--alvo);border:0;border-radius:10px;background:transparent;color:var(--texto-2);cursor:pointer;position:relative}
.btn-icone:hover{background:var(--azul-claro);color:var(--azul-escuro)}
.ponto{position:absolute;top:9px;right:9px;width:10px;height:10px;border-radius:50%;background:#E8890C;border:2px solid #fff}
.usuario{display:flex;align-items:center;gap:10px;padding-left:12px;margin-left:4px;border-left:1px solid var(--borda)}
.usuario .nome{font-weight:600;font-size:.95rem;line-height:1.2}
.usuario .papel{font-size:.8rem;color:var(--texto-2)}
#tela:focus{outline:none}
#tela{flex:1;width:100%;max-width:1160px;padding:28px 32px 48px}
.pilha{display:flex;flex-direction:column;gap:var(--esp)}
.linha{display:flex;align-items:center;gap:var(--esp);flex-wrap:wrap}
.cols-2{display:grid;grid-template-columns:1fr 1fr;gap:var(--esp);align-items:start}
.cols-21{display:grid;grid-template-columns:3fr 2fr;gap:var(--esp);align-items:start}
.cols-3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--esp)}
.cols-4{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--esp)}

/* ---------- Componentes ---------- */
.cabecalho{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--esp);flex-wrap:wrap}
.cabecalho h2{font-size:1.6rem;font-weight:700;line-height:1.25}
.cabecalho .acoes-topo,.acoes-topo{display:flex;gap:var(--esp);flex-wrap:wrap}
.sub{color:var(--texto-2);font-size:.95rem}
.cartao{background:var(--superficie);border:1px solid var(--borda);border-radius:var(--raio);padding:20px}
.cartao h3{font-size:.95rem;font-weight:600;color:var(--texto-2);margin-bottom:8px}
a.cartao:hover{border-color:var(--azul)}
.destaque{background:var(--azul-escuro);border-color:var(--azul-escuro);color:#fff}
.destaque h3{color:#BFDDF2}
.destaque .sub{color:#D6E8F5}
.numero{font-size:1.9rem;font-weight:700;line-height:1.15}
.cols-4 .numero{font-size:1.55rem}
.titulo-secao{font-size:1.05rem;font-weight:700;margin-bottom:12px;color:var(--texto)}
.cartao h3.titulo-secao{color:var(--texto)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--alvo);padding:0 20px;border-radius:10px;border:1.5px solid transparent;font-weight:600;font-size:.98rem;cursor:pointer;white-space:nowrap}
.btn-primario{background:var(--azul-escuro);color:#fff}
.btn-primario:hover{background:#012F61}
.btn-claro{background:#fff;color:var(--azul-escuro)}
.btn-secundario{background:var(--superficie);color:var(--azul-escuro);border-color:var(--borda)}
.btn-secundario:hover{border-color:var(--azul)}
.btn-recusar{background:var(--superficie);color:var(--perigo);border-color:#EBC3BE}
.btn-recusar:hover{background:var(--perigo-claro)}
.btn-grande{min-height:52px;padding:0 28px;font-size:1.02rem}
.btn:disabled{opacity:.45;cursor:not-allowed}

.badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--perigo);color:#fff;font-size:.75rem;font-weight:700}
.avatar{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:var(--azul-claro);color:var(--azul-escuro);font-weight:700;font-size:.9rem;flex:none}
.icone-redondo{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;background:var(--azul-claro);color:var(--azul-escuro);flex:none}
.etiqueta{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:700;white-space:nowrap}
.et-nova{background:var(--azul-claro);color:var(--azul-escuro)}
.et-alt{background:var(--alerta-claro);color:var(--alerta)}
.et-ok{background:var(--sucesso-claro);color:var(--sucesso)}
.et-pend{background:var(--perigo-claro);color:var(--perigo)}

/* Tabelas */
.tabela-wrap{background:var(--superficie);border:1px solid var(--borda);border-radius:var(--raio);overflow:auto}
table.tabela{width:100%;border-collapse:collapse}
.tabela th{text-align:left;font-size:.8rem;font-weight:700;color:var(--texto-2);text-transform:uppercase;letter-spacing:.04em;padding:14px 20px;background:#F8FAFC;border-bottom:1px solid var(--borda);white-space:nowrap}
.tabela td{padding:14px 20px;border-bottom:1px solid var(--borda);vertical-align:middle}
.tabela tr:last-child td{border-bottom:0}
.tabela tbody tr:hover{background:#F8FBFE}
.tabela .num{text-align:right;font-weight:700;white-space:nowrap}
.tabela .acao{text-align:right;width:1%;white-space:nowrap}
.pessoa{display:flex;align-items:center;gap:12px;font-weight:600}
.pessoa small{display:block;font-weight:400;color:var(--texto-2);font-size:.85rem}

/* Listas simples */
.lista{background:var(--superficie);border:1px solid var(--borda);border-radius:var(--raio);overflow:hidden}
.item{display:flex;align-items:center;gap:var(--esp);min-height:68px;padding:12px 20px;border-bottom:1px solid var(--borda)}
.item:last-child{border-bottom:0}
a.item:hover{background:#F8FBFE}
.item .corpo{flex:1;min-width:0}
.item .l1{font-weight:600}
.item .l2{color:var(--texto-2);font-size:.9rem}
.item .valor{font-weight:700;white-space:nowrap}

.barra{height:10px;border-radius:5px;background:#E3EAF2;overflow:hidden;margin:12px 0 8px}
.destaque .barra{background:rgba(255,255,255,.22)}
.barra span{display:block;height:100%;border-radius:5px;background:var(--azul)}
.destaque .barra span{background:#fff}
.dados{display:grid;grid-template-columns:auto 1fr;gap:10px 24px}
.dados dt{color:var(--texto-2)}
.dados dd{font-weight:600;text-align:right}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--borda);margin-top:14px;padding-top:14px;font-weight:700}
.total strong{font-size:1.5rem}
.aviso{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;font-size:.95rem}
.aviso-ok{background:var(--sucesso-claro);color:var(--sucesso)}
.aviso-info{background:var(--azul-claro);color:var(--azul-escuro)}
.aviso-alerta{background:var(--alerta-claro);color:var(--alerta)}

.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:var(--alvo);padding:0 18px;border-radius:999px;border:1.5px solid var(--borda);background:var(--superficie);font-weight:600;font-size:.95rem;cursor:pointer}
.chip:hover{border-color:var(--azul)}
.chip[aria-pressed="true"]{border-color:var(--azul-escuro);background:var(--azul-claro);color:var(--azul-escuro)}
label.campo{display:flex;flex-direction:column;gap:6px;font-weight:600}
.campo input,.campo textarea{min-height:var(--alvo);padding:11px 14px;border:1.5px solid var(--borda);border-radius:10px;background:#fff;font-weight:400}
.campo textarea{min-height:130px;resize:vertical}
.campo input:focus,.campo textarea:focus{outline:none;border-color:var(--azul)}
.dica{font-size:.86rem;color:var(--texto-2);font-weight:400}
.erro{font-size:.86rem;color:var(--perigo);font-weight:600}

.centro{max-width:660px;margin:0 auto}
.feito{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--esp);padding:40px 32px}
.feito .circulo{display:flex;align-items:center;justify-content:center;width:88px;height:88px;border-radius:50%}
.feito .circulo svg{width:44px;height:44px;stroke-width:2.4}
.feito h2{font-size:1.6rem;line-height:1.25}
.feito p{color:var(--texto-2);max-width:440px}

.barras-h{display:flex;flex-direction:column;gap:14px}
.barras-h .rot{display:flex;justify-content:space-between;font-size:.95rem;margin-bottom:6px}
.barras-h .trilho{height:12px;border-radius:6px;background:#E3EAF2;overflow:hidden}
.barras-h .trilho span{display:block;height:100%;background:var(--azul);border-radius:6px}
ul.regras{display:flex;flex-direction:column;gap:10px;padding-left:20px}

/* Telas sem menu (login, mapa e sobre antes de entrar) */
body.sem-menu .sidebar,body.sem-menu .topo{display:none}
body.sem-menu #tela{max-width:none;padding:0}
.login{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.login .lado{background:var(--azul-escuro);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.login .lado .marca{display:flex;align-items:center;gap:12px;font-size:1.6rem;font-weight:700}
.login .lado h2{font-size:2.3rem;line-height:1.2;max-width:460px}
.login .lado p{color:#D6E8F5;max-width:440px;margin-top:14px;font-size:1.05rem}
.login .form-lado{display:flex;flex-direction:column;justify-content:center;padding:56px;max-width:520px;width:100%;margin:0 auto}
.login .rodape{margin-top:40px;display:flex;align-items:center;gap:16px;color:var(--texto-2);font-size:.85rem}
.login .rodape a{display:inline-flex;align-items:center;min-height:var(--alvo);text-decoration:underline;font-weight:600;color:var(--azul-escuro)}
.logo-fgv{height:26px;width:auto}
.pagina-solta{max-width:1160px;margin:0 auto;padding:40px 32px}

/* Mapa das telas */
.mapa{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--esp)}
.mapa a{display:flex;flex-direction:column;gap:6px;padding:18px;background:var(--superficie);border:1px solid var(--borda);border-radius:var(--raio);min-height:120px}
.mapa a:hover{border-color:var(--azul);box-shadow:0 0 0 3px var(--azul-claro)}
.mapa .n{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;background:var(--azul-escuro);color:#fff;font-weight:700;font-size:.9rem}
.mapa .t{font-weight:700}
.mapa .d{font-size:.88rem;color:var(--texto-2)}

.toast{position:fixed;right:32px;bottom:32px;transform:translateY(20px);opacity:0;z-index:50;background:var(--texto);color:#fff;padding:14px 20px;border-radius:12px;font-weight:600;transition:.25s;pointer-events:none}
.toast.ver{opacity:1;transform:translateY(0)}

/* Janelas estreitas (ex.: pré-visualização): o menu vira barra superior */
@media (max-width:980px){
  .app{flex-direction:column}
  .sidebar{width:auto;height:auto;position:static;flex-direction:row;align-items:center;gap:8px;padding:10px 16px;overflow-x:auto}
  .sidebar .marca{padding:0 12px 0 0}
  .sidebar nav{flex-direction:row}
  .sidebar nav a{white-space:nowrap}
  .sidebar .pe{display:none}
  .topo{padding:0 16px}
  #tela{padding:20px 16px 40px}
  .cols-2,.cols-21,.cols-3,.cols-4,.login{grid-template-columns:1fr}
  .usuario .txt{display:none}
  .login .lado,.login .form-lado,.pagina-solta{padding:32px 20px}
}
</style>
</head>

      <div class="aviso aviso-info">${ic('fin')}<span>${tot>0?`Com este pedido, o orçamento da área passa de <strong>${antes}%</strong> para <strong>${depois}%</strong> usado.`:`Esta alteração <strong>reduz</strong> o custo da viagem em ${brl(Math.abs(tot))}.`}</span></div>

      <li><strong>Botões de no mínimo 0,8 cm:</strong> todos os botões e links clicáveis têm pelo menos 44 px de altura (cerca de 1,2 cm), e as decisões principais (Aprovar e Recusar) têm 52 px.</li>
      <li><strong>Espaçamento de 4 mm</strong> entre cartões e entre botões vizinhos, para evitar cliques errados (Lei de Fitts).</li>
      <li><strong>Área nobre da tela:</strong> o que exige ação fica no alto e à esquerda, acima da dobra. Os botões Aprovar e Recusar aparecem no topo do pedido, sem precisar rolar a página.</li>
      <li><strong>Poucos elementos por tela:</strong> cada tela tem um único objetivo, pensando em gestores com agenda cheia e atenção dividida.</li>
      <li><strong>Mais importante no topo do menu:</strong> a ordem e os nomes do menu vieram de um card sorting híbrido com 7 participantes no UXtweak, e as pendências mais urgentes aparecem primeiro.</li>
      <li><strong>Feedback (Norman):</strong> toda ação termina numa confirmação clara do que aconteceu.</li>
      <li><strong>Restrição (Norman):</strong> recusar um pedido exige um motivo, e o botão só é liberado quando ele é preenchido.</li>
      <li><strong>Lei de Jakob:</strong> menu lateral, tabelas e cartões seguem o padrão de sistemas corporativos que o gestor já conhece.</li>
    </ul>
  </section>
  <a class="btn btn-primario" href="#/mapa" style="align-self:flex-start">${ic('grade')}Ver mapa das telas</a>
</div>`});

/* Mapa das telas: índice para navegar e apresentar */
const TELAS = [
  ['login','Login','Primeiro acesso ao site'],
  ['inicio','Início','Resumo do dia: pendências, viagens e orçamento'],
  ['pendencias','Pendências','Pedidos aguardando aprovação'],
  ['pedido/p1','Pedido de viagem','Detalhes, custo e decisão'],
  ['recusar/p2','Recusar pedido','Motivo obrigatório (restrição)'],
  ['sucesso','Confirmação','Feedback depois de aprovar ou recusar'],
  ['agenda','Agenda da equipe','Quem está viajando e as próximas viagens'],
  ['historico','Histórico de viagens','Viagens já realizadas'],
  ['financeiro','Financeiro e relatórios','Orçamento, gastos e diárias'],
  ['prestacao','Prestação de contas','Recibos e lembretes'],
  ['exportar','Exportar relatório','Escolha de período e formato'],
  ['notificacoes','Notificações','Avisos do sistema'],
  ['ajuda','Política e ajuda','Regras e contato com o setor de viagens'],
  ['sobre','Sobre este protótipo','Decisões de UX aplicadas']
];
T.mapa = solta => ({titulo:'Mapa das telas', semMenu:solta, html:`
<div class="pilha ${solta?'pagina-solta':''}">
  ${solta?`<a class="btn btn-secundario" href="#/login" style="align-self:flex-start">${ic('voltar')}Voltar ao login</a><h2 style="font-size:1.6rem">Mapa das telas</h2>`:''}
  <p class="sub">As ${TELAS.length} telas do protótipo. Clique em qualquer uma para abrir. A jornada principal começa no login e termina na confirmação da aprovação.</p>
  <div class="mapa">${TELAS.map((t,i)=>`<a href="#/${t[0]}"><span class="n">${i+1}</span><span class="t">${t[1]}</span><span class="d">${t[2]}</span></a>`).join('')}</div>
</div>`});

/* ===== Roteador ===== */
let dentro = false; // já passou pelo login nesta visita?
const tela = document.getElementById('tela');
function rota(){
  const [nome, param] = (location.hash.replace(/^#\/?/,'') || 'login').split('/');
  if(nome==='login') dentro = false;
  else if(nome!=='sobre' && nome!=='mapa') dentro = true; // protótipo: qualquer tela abre direto
  const fn = T[nome] || T.inicio;
  const v = (nome==='sobre' || nome==='mapa') ? fn(!dentro) : fn(param);
  document.body.classList.toggle('sem-menu', !!v.semMenu);
  document.getElementById('titulo').textContent = v.titulo || '';
  document.getElementById('trilha').innerHTML = v.trilha ? `<a href="${v.trilha[1]}">${v.trilha[0]}</a> ›` : '';
  desenharMenu(v.menu || '');
  tela.innerHTML = v.html;
  document.title = (v.titulo ? v.titulo+' · ' : '') + 'Embarca';
  window.scrollTo(0,0);
  tela.focus({preventScroll:true});
}
window.addEventListener('hashchange', rota);

function aviso(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('ver');
  clearTimeout(aviso.t); aviso.t = setTimeout(()=>t.classList.remove('ver'), 2600);
}
function concluir(p, tipo){
  estado.pedidos = estado.pedidos.filter(x=>x!==p);
  estado.notificacoes.forEach(n=>{ if(n.link.endsWith(p.id)) n.lida=true; });
  estado.ultimo = {tipo, nome:p.nome};
  location.hash = '#/sucesso';
}

/* ===== Ações ===== */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-acao]'); if(!b) return;
  const a = b.dataset.acao;
  if(a==='aprovar'){
    const p = estado.pedidos.find(x=>x.id===b.dataset.id);
    estado.gasto += Math.max(totalPedido(p),0);
    if(p.tipo==='nova') estado.proximas.push({nome:p.nome,ini:p.ini,destino:p.destino,per:`${p.ida} a ${p.volta}`});
    concluir(p,'aprovado');
  }
  if(a==='motivo'){
    const ta = document.getElementById('motivo');
    document.querySelectorAll('[data-acao="motivo"]').forEach(c=>c.setAttribute('aria-pressed', c===b));
    ta.value = b.textContent + '. '; ta.focus(); ta.dispatchEvent(new Event('input',{bubbles:true}));
  }
  if(a==='opcao'){ estado.exportar[b.dataset.campo] = b.dataset.valor;
    document.querySelectorAll(`[data-campo="${b.dataset.campo}"]`).forEach(c=>c.setAttribute('aria-pressed', c===b)); }
  if(a==='gerar'){ estado.ultimo = {tipo:'exportado',...estado.exportar}; location.hash = '#/sucesso'; }
  if(a==='lembrar'){ const x = estado.prestacao[b.dataset.i]; b.disabled = true; b.textContent = 'Lembrete enviado'; aviso(`Lembrete enviado para ${x.nome}`); }
  if(a==='contato'){ aviso(b.dataset.msg); }
  if(a==='ler'){ estado.notificacoes[b.dataset.i].lida = true; }
});
document.addEventListener('input', e => {
  if(e.target.id==='motivo') document.getElementById('confirmar-recusa').disabled = e.target.value.trim().length < 5;
  if(e.target.id==='senha') document.getElementById('erro-login').hidden = true;
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if(e.target.id==='form-login'){
    if(!document.getElementById('senha').value.trim()){ document.getElementById('erro-login').hidden = false; document.getElementById('senha').focus(); return; }
    location.hash = '#/inicio';
  }
  if(e.target.id==='form-recusa'){
    if(document.getElementById('motivo').value.trim().length<5) return;
    concluir(estado.pedidos.find(x=>x.id===e.target.dataset.id),'recusado');
  }
});

rota();
</script>
</body>
</html>
